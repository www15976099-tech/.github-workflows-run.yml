yamlname: Toy Monitor Bot

on:
  push:
    branches: [ main ]
  # 接收外部 Cron-Job.org 每 10 分鐘一次的強制喚醒訊號
  repository_dispatch:
    types: [ trigger_crawler ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 複製儲存庫檔案
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: 2. 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 4. 執行玩具店爬蟲
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python monitor.py

    - name: 5. 自動將新商品紀錄同步回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add checked_toys_with_img.json || true
        git commit -m "自動更新已檢查商品紀錄 [skip ci]" -a || echo "沒有新貨，無需更新歷史紀錄"
        git push || echo "推送失敗或無內容更新"
